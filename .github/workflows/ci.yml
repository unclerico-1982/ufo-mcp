name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (sets up Python 3.11 + venv)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.11"
          activate-environment: true

      - name: Install project (with dev extras)
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest -q
